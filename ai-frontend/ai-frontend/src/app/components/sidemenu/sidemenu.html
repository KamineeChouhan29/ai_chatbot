<aside id="default-sidebar" 
  class="fixed inset-y-0 left-0 z-50 w-72 h-full transform transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] md:translate-x-0"
  [ngClass]="isOpen ? 'translate-x-0' : '-translate-x-full'"
  aria-label="Sidebar">
   
   <div class="h-full px-4 py-8 overflow-y-auto bg-[#0a0a0a] border-r border-white/5 flex flex-col">
      
      <!-- Logo Area -->
      <div class="flex items-center gap-3 px-3 mb-10">
         <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-500 to-indigo-600 shadow-[0_0_15px_rgba(37,99,235,0.4)] flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
         </div>
         <span class="text-xl font-bold text-white tracking-tight">AI Assistant</span>
      </div>

      <ul class="space-y-1 font-medium flex-1">
         
         <li>
            <a (click)="closeMenu.emit()" routerLink="/dashboard" routerLinkActive="bg-white/10 text-white shadow-sm border border-white/5" [routerLinkActiveOptions]="{ exact: true }" #dashboard="routerLinkActive" class="flex items-center px-3 py-2.5 rounded-xl transition-all duration-300 hover:bg-white/5 group border border-transparent">
               <svg class="w-5 h-5 transition duration-300" [ngClass]="dashboard.isActive ? 'text-blue-400' : 'text-gray-500 group-hover:text-gray-300'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
               <span class="flex-1 ms-3" [ngClass]="dashboard.isActive ? 'text-white font-medium' : 'text-gray-400 group-hover:text-gray-200'">Dashboard</span>
            </a>
         </li>
      
         <li>
            <a (click)="closeMenu.emit()" routerLink="/chat" routerLinkActive="bg-white/10 text-white shadow-sm border border-white/5" [routerLinkActiveOptions]="{ exact: true }" #rla="routerLinkActive" class="flex items-center px-3 py-2.5 rounded-xl transition-all duration-300 hover:bg-white/5 group border border-transparent">
               <svg class="w-5 h-5 transition duration-300" [ngClass]="rla.isActive ? 'text-blue-400' : 'text-gray-500 group-hover:text-gray-300'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
               <span class="flex-1 ms-3" [ngClass]="rla.isActive ? 'text-white font-medium' : 'text-gray-400 group-hover:text-gray-200'">Ask AI</span>
               <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-md" [ngClass]="rla.isActive ? 'bg-blue-500/20 text-blue-400' : 'bg-white/5 text-gray-500'">Pro</span>
            </a>
         </li>
           
         <li>
            <a (click)="closeMenu.emit()" routerLink="/cricket" routerLinkActive="bg-white/10 text-white shadow-sm border border-white/5" [routerLinkActiveOptions]="{ exact: true }" #cricket="routerLinkActive" class="flex items-center px-3 py-2.5 rounded-xl transition-all duration-300 hover:bg-white/5 group border border-transparent">
               <svg class="w-5 h-5 transition duration-300" [ngClass]="cricket.isActive ? 'text-emerald-400' : 'text-gray-500 group-hover:text-gray-300'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
               <span class="flex-1 ms-3" [ngClass]="cricket.isActive ? 'text-white font-medium' : 'text-gray-400 group-hover:text-gray-200'">Cricket Bot</span>
            </a>
         </li>

         <li>
            <a (click)="closeMenu.emit()" routerLink="/image" routerLinkActive="bg-white/10 text-white shadow-sm border border-white/5" [routerLinkActiveOptions]="{ exact: true }" #image="routerLinkActive" class="flex items-center px-3 py-2.5 rounded-xl transition-all duration-300 hover:bg-white/5 group border border-transparent">
               <svg class="w-5 h-5 transition duration-300" [ngClass]="image.isActive ? 'text-purple-400' : 'text-gray-500 group-hover:text-gray-300'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
               <span class="flex-1 ms-3" [ngClass]="image.isActive ? 'text-white font-medium' : 'text-gray-400 group-hover:text-gray-200'">Generate Image</span>
            </a>
         </li>

         <div class="my-6 border-t border-white/5"></div>

         <li>
            <a (click)="toggleHistory()" class="flex items-center px-3 py-2.5 rounded-xl cursor-pointer transition-all duration-300 hover:bg-white/5 group border border-transparent text-gray-400 hover:text-gray-200">
               <svg class="w-5 h-5 transition duration-300 group-hover:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
               <span class="flex-1 ms-3">Recent Chats</span>
               <span class="bg-white/5 text-gray-500 text-[10px] font-bold px-2 py-0.5 rounded-md">{{ history.length }}</span>
               <svg class="w-4 h-4 ml-2 transition-transform duration-300" [ngClass]="{'rotate-180': showHistory}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </a>
         </li>

         <li *ngIf="showHistory">
            <ul class="mt-2 space-y-1 pl-4 border-l border-white/5 ml-5">
               <li *ngFor="let h of history">
                  <a (click)="openHistory(h)" class="flex items-center px-3 py-2 rounded-lg cursor-pointer text-xs text-gray-500 hover:text-gray-200 hover:bg-white/5 transition-all duration-200">
                     <span class="w-1.5 h-1.5 rounded-full bg-blue-500/50 mr-3 shrink-0"></span>
                     <span class="truncate">{{ h.question }}</span>
                  </a>
               </li>
            </ul>
         </li>

         <div class="my-6 border-t border-white/5"></div>

         <li>
            <a (click)="closeMenu.emit()" routerLink="/feedback" routerLinkActive="bg-white/10 shadow-sm border border-white/5" #feedback="routerLinkActive" class="flex items-center px-3 py-2.5 rounded-xl transition-all duration-300 hover:bg-white/5 group border border-transparent">
               <svg class="w-5 h-5 transition duration-300" [ngClass]="feedback.isActive ? 'text-pink-400' : 'text-gray-500 group-hover:text-gray-300'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.514"></path></svg>
               <span class="flex-1 ms-3" [ngClass]="feedback.isActive ? 'text-white' : 'text-gray-400 group-hover:text-gray-200'">Feedback</span>
            </a>
         </li>

         <li>
            <a (click)="closeMenu.emit()" routerLink="/help" routerLinkActive="bg-white/10 shadow-sm border border-white/5" #help="routerLinkActive" class="flex items-center px-3 py-2.5 rounded-xl transition-all duration-300 hover:bg-white/5 group border border-transparent">
               <svg class="w-5 h-5 transition duration-300" [ngClass]="help.isActive ? 'text-indigo-400' : 'text-gray-500 group-hover:text-gray-300'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
               <span class="flex-1 ms-3" [ngClass]="help.isActive ? 'text-white' : 'text-gray-400 group-hover:text-gray-200'">Help</span>
            </a>
         </li>

      </ul>
   </div>
</aside>
