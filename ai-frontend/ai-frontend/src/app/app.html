<!-- Dashboard -->
<div *ngIf="router.url === '/dashboard'">
    <router-outlet></router-outlet>
</div>

<!-- Other Pages -->
<div *ngIf="router.url !== '/dashboard'" class="min-h-screen bg-slate-950 flex flex-col md:flex-row">

    <!-- Mobile Header Bar -->
    <div class="md:hidden flex items-center justify-between px-6 py-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
        <div class="font-bold text-xl text-white">AI Assistant</div>
        <button (click)="toggleMobileMenu()" class="text-slate-300 hover:text-white focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>

    <!-- Backdrop for mobile menu -->
    <div *ngIf="isMobileMenuOpen" (click)="isMobileMenuOpen = false" class="fixed inset-0 bg-black/60 z-40 md:hidden backdrop-blur-sm transition-opacity duration-300"></div>

    <!-- Sidebar Drawer -->
    <app-sidemenu [isOpen]="isMobileMenuOpen" (closeMenu)="isMobileMenuOpen = false"></app-sidemenu>

    <!-- Main Content Area -->
    <div class="md:pl-72 w-full flex-1">
        <router-outlet></router-outlet>
    </div>

</div>
