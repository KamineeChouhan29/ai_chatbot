<div class="flex-1 flex flex-col h-[92vh] bg-[#0a0a0a] rounded-3xl overflow-hidden shadow-[0_0_40px_rgba(16,185,129,0.05)] border border-white/5">

    <!-- Header -->
    <div class="border-b border-white/5 px-6 py-4 bg-white/[0.02] backdrop-blur-md flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div>
            <h1 class="text-lg font-semibold text-white tracking-tight">Cricket Bot</h1>
            <p class="text-xs text-gray-400 font-medium">Smart sports analytics</p>
        </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto px-4 md:px-8 py-6 space-y-6">
        <div *ngFor="let m of messagesArray" class="flex" [ngClass]="{'justify-end': m.own, 'justify-start': !m.own}">

            <!-- Bot Avatar -->
            <div *ngIf="!m.own" class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center mr-3 shrink-0 shadow-lg shadow-emerald-500/20 mt-1">
                <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>

            <!-- Message Bubble -->
            <div class="max-w-[85%] md:max-w-[75%] rounded-2xl px-5 py-3.5 shadow-sm whitespace-pre-wrap text-[15px] leading-relaxed border"
                [ngClass]="{
                    'bg-emerald-600 text-white border-emerald-500 rounded-tr-sm': m.own,
                    'bg-white/5 border-white/10 text-gray-200 rounded-tl-sm': !m.own
                }">
                {{ m.content }}
            </div>
        </div>

        <div *ngIf="loadingChat" class="flex">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center mr-3 shrink-0 shadow-lg shadow-emerald-500/20 mt-1">
                <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-2xl rounded-tl-sm px-5 py-3.5 text-gray-400 text-[15px] flex items-center gap-1">
                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></span>
                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></span>
                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
            </div>
        </div>
    </div>

    <!-- Input -->
    <div class="border-t border-white/5 bg-[#0a0a0a] p-4 md:p-5">
        <div class="flex gap-3 max-w-4xl mx-auto items-end bg-white/5 border border-white/10 rounded-3xl p-1 focus-within:border-emerald-500/50 focus-within:bg-white/[0.07] transition-all duration-300">
            <textarea
                [(ngModel)]="inputTextPrompt"
                rows="1"
                placeholder="Ask anything about cricket..."
                class="flex-1 resize-none bg-transparent border-none px-5 py-3.5 text-white placeholder-gray-500 focus:ring-0 outline-none max-h-32 min-h-[52px]">
            </textarea>
            <button
                (click)="askButtonClicked()"
                [disabled]="loadingChat || !inputTextPrompt.trim()"
                class="shrink-0 h-11 w-11 m-1 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center transition duration-300 disabled:opacity-30 disabled:bg-white/10 disabled:text-gray-500">
                <svg class="w-5 h-5 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
    </div>
</div>
