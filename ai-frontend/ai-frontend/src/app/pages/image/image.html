<div class="flex-1 flex flex-col h-[92vh] bg-[#0a0a0a] rounded-3xl overflow-hidden shadow-[0_0_40px_rgba(168,85,247,0.05)] border border-white/5">

    <!-- Header -->
    <div class="border-b border-white/5 px-6 py-4 bg-white/[0.02] backdrop-blur-md flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-500 to-pink-600 flex items-center justify-center shadow-lg shadow-purple-500/20">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <div>
            <h1 class="text-lg font-semibold text-white tracking-tight">Image Generator</h1>
            <p class="text-xs text-gray-400 font-medium">High-resolution AI art</p>
        </div>
    </div>

    <!-- Response Area -->
    <div class="flex-1 overflow-y-auto px-6 py-6">

        <!-- Loading -->
        <div *ngIf="loadingChat" class="flex justify-center items-center h-full">
            <div class="bg-white/5 border border-white/10 backdrop-blur-md rounded-3xl px-8 py-8 text-center shadow-2xl">
                <div class="w-12 h-12 mx-auto rounded-xl bg-gradient-to-tr from-purple-500 to-pink-600 flex items-center justify-center mb-4 animate-pulse shadow-lg shadow-purple-500/20">
                    <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
                <h2 class="text-xl font-semibold text-white">Generating Image...</h2>
                <p class="text-gray-400 mt-2 text-sm">Please wait while AI creates your masterpiece.</p>
            </div>
        </div>

        <!-- Generated Image -->
        <div *ngIf="imageUrl && !loadingChat" class="flex justify-center items-center h-full">
            <div class="bg-white/5 border border-white/10 rounded-3xl p-3 shadow-2xl relative group overflow-hidden backdrop-blur-md">
                <div class="absolute inset-0 bg-gradient-to-tr from-purple-500/10 to-pink-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
                <img [src]="imageUrl" alt="Generated Image" class="rounded-2xl max-h-[600px] max-w-full object-contain relative z-10 shadow-lg">
            </div>
        </div>

        <!-- Text Response -->
        <div *ngIf="answer && !loadingChat" class="flex justify-center mt-6">
            <div class="bg-white/5 border border-white/10 rounded-2xl p-6 shadow-xl max-w-3xl w-full backdrop-blur-md flex gap-4">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-pink-600 flex items-center justify-center shrink-0 shadow-lg shadow-purple-500/20">
                    <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
                <div>
                    <h2 class="text-base font-semibold text-white mb-2">AI Response</h2>
                    <div class="prose prose-invert max-w-none text-gray-300 leading-relaxed text-[15px] [&>*:first-child]:mt-0 [&>*:last-child]:mb-0" [innerHTML]="formatMessage(answer)"></div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="!imageUrl && !answer && !loadingChat" class="flex flex-col justify-center items-center h-full text-center">
            <div class="w-20 h-20 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-6 shadow-lg shadow-purple-500/5">
                <svg class="w-10 h-10 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            </div>
            <h2 class="text-3xl font-bold text-white tracking-tight">Create Amazing AI Images</h2>
            <p class="text-gray-400 mt-4 max-w-md mx-auto text-sm leading-relaxed">Enter a detailed prompt below. The more descriptive you are, the better the resulting image will be.</p>
        </div>

    </div>

    <!-- Input -->
    <div class="border-t border-white/5 bg-[#0a0a0a] p-4 md:p-5">
        <div class="flex gap-3 max-w-4xl mx-auto items-end bg-white/5 border border-white/10 rounded-3xl p-1 focus-within:border-purple-500/50 focus-within:bg-white/[0.07] transition-all duration-300">
            <textarea
                [(ngModel)]="inputTextPrompt"
                rows="1"
                placeholder="Describe the image you want to generate..."
                class="flex-1 resize-none bg-transparent border-none px-5 py-3.5 text-white placeholder-gray-500 focus:ring-0 outline-none max-h-32 min-h-[52px]">
            </textarea>
            <button
                (click)="askButtonClicked()"
                [disabled]="loadingChat || !inputTextPrompt.trim()"
                class="shrink-0 h-11 w-11 m-1 rounded-2xl bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center transition duration-300 disabled:opacity-30 disabled:bg-white/10 disabled:text-gray-500">
                <svg class="w-5 h-5 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
    </div>
</div>
