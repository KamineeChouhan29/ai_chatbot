<div class="flex-1 flex flex-col h-[92vh] bg-[#0a0a0a] rounded-3xl overflow-hidden shadow-[0_0_40px_rgba(79,70,229,0.05)] border border-white/5">

    <!-- Header -->
    <div class="border-b border-white/5 px-6 py-4 bg-white/[0.02] backdrop-blur-md flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </div>
        <div>
            <h1 class="text-lg font-semibold text-white tracking-tight">Help & Support</h1>
            <p class="text-xs text-gray-400 font-medium">Get assistance from our engineering team</p>
        </div>
    </div>

    <!-- Content Area -->
    <div class="flex-1 overflow-y-auto px-4 md:px-8 py-10 flex justify-center items-start">
        <div class="bg-white/[0.02] border border-white/5 backdrop-blur-xl w-full max-w-xl rounded-3xl p-8 md:p-10 shadow-2xl relative overflow-hidden">
            
            <div class="absolute -top-20 -right-20 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10">
                <h2 class="text-2xl text-center font-bold text-white mb-2 tracking-tight">Contact Support</h2>
                <p class="text-gray-400 text-center mb-8 text-sm">Fill out the form below and we will assist you.</p>
                
                <form #helpForm="ngForm" (ngSubmit)="sendRequest(helpForm)">
                    <!-- Name -->
                    <div class="mb-5">
                        <label class="block text-gray-300 mb-2 text-sm font-medium">Name</label>
                        <input type="text" name="name" [(ngModel)]="helpRequest.name" placeholder="Enter your name" required
                        class="w-full p-3.5 rounded-xl bg-white/5 text-white border border-white/10 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-gray-500 transition">
                    </div>

                    <!-- Email -->
                    <div class="mb-5">
                        <label class="block text-gray-300 mb-2 text-sm font-medium">Email</label>
                        <input type="email" name="email" [(ngModel)]="helpRequest.email" placeholder="Enter your email" required
                        class="w-full p-3.5 rounded-xl bg-white/5 text-white border border-white/10 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-gray-500 transition">
                    </div>

                    <!-- Subject -->
                    <div class="mb-5">
                        <label class="block text-gray-300 mb-2 text-sm font-medium">Subject</label>
                        <input type="text" name="subject" [(ngModel)]="helpRequest.subject" placeholder="Enter subject" required
                        class="w-full p-3.5 rounded-xl bg-white/5 text-white border border-white/10 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-gray-500 transition">
                    </div>

                    <!-- Message -->
                    <div class="mb-8">
                        <label class="block text-gray-300 mb-2 text-sm font-medium">Message</label>
                        <textarea rows="4" name="message" [(ngModel)]="helpRequest.message" placeholder="Describe your issue..." required
                        class="w-full p-3.5 rounded-xl bg-white/5 text-white border border-white/10 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-gray-500 resize-none transition"></textarea>
                    </div>

                    <!-- Button -->
                    <button type="submit" [disabled]="loading"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-white/10 disabled:text-gray-500 text-white font-medium py-3.5 rounded-xl transition duration-300 shadow-[0_0_20px_rgba(79,70,229,0.2)]">
                        {{ loading ? 'Sending...' : 'Send Request' }}
                    </button>
                </form>

                <!-- Alerts -->
                <div *ngIf="successMessage" class="mt-6 p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm font-medium text-center flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    {{ successMessage }}
                </div>
                <div *ngIf="errorMessage" class="mt-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm font-medium text-center flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    {{ errorMessage }}
                </div>
            </div>
        </div>
    </div>
</div>
